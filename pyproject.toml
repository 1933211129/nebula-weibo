[tool.ruff]
target-version = "py39"
line-length = 100
include = ["server/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"server/db.py" = ["E402"]
"server/security.py" = ["F401"]
"server/worker.py" = ["F401"]
"server/collector/transport.py" = ["F401"]
"tests/unit/test_research.py" = ["E402"]
"tests/live_reply_pagination.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
